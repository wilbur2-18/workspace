<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>综合分析平台需求台账</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d8e0ea;
      --line-soft: #e8eef5;
      --blue: #1677ff;
      --green: #168a5b;
      --orange: #b66a00;
      --gray: #697586;
      --red: #b42318;
      --shadow: 0 18px 45px rgba(38, 55, 77, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.5;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 32px 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(94px, 1fr));
      gap: 10px;
      min-width: 470px;
    }

    .metric {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 18px rgba(39, 58, 84, 0.06);
    }

    .metric strong {
      display: block;
      font-size: 21px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .ledger {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 16px;
      min-height: calc(100vh - 220px);
    }

    .sidebar,
    .preview {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-head {
      padding: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .sidebar-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .search {
      width: 100%;
      height: 34px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    .req-list {
      overflow: auto;
      padding: 8px;
    }

    .req-item {
      width: 100%;
      margin: 0 0 6px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .req-item:hover {
      background: #f8fbff;
      border-color: var(--line-soft);
    }

    .req-item.active {
      background: #eef5ff;
      border-color: #b9d5ff;
    }

    .req-line {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 5px;
    }

    .req-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .req-desc {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .req-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .badge,
    .priority {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .priority {
      min-width: 34px;
      border-radius: 7px;
    }

    .s-intake { background: #eef5ff; color: #1459b8; }
    .s-design { background: #fff3df; color: #9a5a00; }
    .s-dev { background: #eaf8f2; color: #0f6f48; }
    .s-live { background: #f1f5f9; color: #526174; }
    .p1 { background: #fff0ed; color: var(--red); }
    .p2 { background: #fff7e8; color: var(--orange); }
    .p3 { background: #eef6ff; color: var(--blue); }
    .p4 { background: #f1f5f9; color: var(--gray); }

    .preview {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .preview-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line-soft);
      background: #fbfdff;
    }

    .preview-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
    }

    .preview-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    a.button:hover {
      border-color: #b9d5ff;
      background: #f4f8ff;
      text-decoration: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
    }

    .summary-card {
      padding: 10px 12px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: #fbfdff;
    }

    .summary-card span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-card strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .markdown {
      overflow: auto;
      padding: 22px 28px 32px;
      font-size: 14px;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      line-height: 1.35;
    }

    .markdown h1 {
      margin: 0 0 18px;
      font-size: 25px;
    }

    .markdown h2 {
      margin: 26px 0 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line-soft);
      font-size: 18px;
    }

    .markdown h3 {
      margin: 20px 0 10px;
      font-size: 15px;
    }

    .markdown p {
      margin: 0 0 12px;
    }

    .markdown ul,
    .markdown ol {
      margin: 0 0 14px 22px;
      padding: 0;
    }

    .markdown li {
      margin: 4px 0;
    }

    .markdown table {
      width: 100%;
      margin: 10px 0 16px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .markdown th,
    .markdown td {
      padding: 9px 10px;
      border: 1px solid var(--line-soft);
      text-align: left;
      vertical-align: top;
    }

    .markdown th {
      background: #f3f7fb;
      color: #42526b;
      font-weight: 800;
    }

    .markdown code {
      padding: 1px 5px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .markdown hr {
      margin: 20px 0;
      border: 0;
      border-top: 1px solid var(--line-soft);
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .page { padding: 20px; }
      .header { display: block; }
      .meta { margin-top: 16px; min-width: 0; }
      .toolbar { grid-template-columns: 1fr; }
      .note { text-align: left; }
      .ledger { grid-template-columns: 1fr; }
      .sidebar { max-height: 430px; }
      .preview-head { grid-template-columns: 1fr; }
      .head-actions { justify-content: flex-start; }
      .summary { grid-template-columns: 1fr; }
    }

    .ledger-page {
      max-width: 1680px;
      min-height: 100vh;
      padding: 24px 28px 36px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(560px, 720px);
      gap: 24px;
      align-items: stretch;
      margin-bottom: 16px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid rgba(120, 144, 174, 0.32);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(246,249,253,0.86)),
        radial-gradient(circle at 12% 20%, rgba(22,119,255,0.12), transparent 28%);
      box-shadow: 0 22px 56px rgba(33, 47, 69, 0.11);
    }

    .hero-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-bottom: 8px;
      color: #3e5c84;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: 30px;
    }

    .hero .meta {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-width: 0;
      align-content: stretch;
    }

    .hero .metric {
      position: relative;
      display: flex;
      min-height: 116px;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.74);
    }

    .metric small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric .metric-bar {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eef5;
    }

    .metric .metric-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
    }

    .command-bar {
      grid-template-columns: minmax(260px, 1.2fr) auto auto 190px auto;
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(33, 47, 69, 0.08);
    }

    .search-wrap,
    .select-wrap {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .select-wrap select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .segmented {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-self: end;
      justify-content: flex-start;
    }

    .segment {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: #42526b;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .segment.active {
      border-color: #a8c8f4;
      background: #edf5ff;
      color: #1459b8;
    }

    .compact .segment {
      min-width: 48px;
      padding: 0 9px;
    }

    .ops-layout {
      grid-template-columns: 280px minmax(420px, 0.95fr) minmax(520px, 1.25fr);
      min-height: calc(100vh - 236px);
    }

    .control-panel,
    .table-panel,
    .preview {
      border-radius: 16px;
    }

    .panel-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .focus-list {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding: 12px;
    }

    .focus-card {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: #fbfdff;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .focus-card:hover,
    .focus-card.active {
      border-color: #b9d5ff;
      background: #f0f6ff;
    }

    .focus-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .focus-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .table-panel {
      display: flex;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--line-soft);
      background: #fbfdff;
    }

    .table-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .ghost-button {
      height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #42526b;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .ghost-button:hover {
      border-color: #b9d5ff;
      color: var(--blue);
    }

    .ledger-table {
      display: grid;
      gap: 8px;
      padding: 10px;
    }

    .ledger-table .req-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      margin: 0;
      border-color: var(--line-soft);
      background: #fff;
    }

    .ledger-table .req-item:hover,
    .ledger-table .req-item.active {
      border-color: #b9d5ff;
      background: #f7fbff;
    }

    .req-main {
      min-width: 0;
    }

    .req-next {
      grid-column: 1 / -1;
      padding-top: 8px;
      border-top: 1px dashed var(--line-soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .req-module {
      max-width: 126px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-head {
      background:
        linear-gradient(180deg, #fbfdff, #fff);
    }

    .preview-title {
      margin-top: 4px;
      font-size: 24px;
    }

    .preview-subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    @media (max-width: 1400px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .ops-layout {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .preview {
        grid-column: 1 / -1;
        min-height: 620px;
      }
    }

    @media (max-width: 980px) {
      .ledger-page {
        padding: 16px;
      }

      .hero,
      .command-bar,
      .ops-layout {
        grid-template-columns: 1fr;
      }

      .hero .meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .command-bar .note {
        text-align: left;
      }
    }

    .ledger-page {
      max-width: 1660px;
    }

    body {
      background:
        radial-gradient(circle at 14% 8%, rgba(167, 131, 79, 0.16), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(49, 95, 134, 0.10), transparent 24%),
        linear-gradient(135deg, #efe8d8 0%, #f7f2e8 42%, #e8dbc3 100%);
      color: #2f281f;
    }

    .hero,
    .command-bar,
    .control-panel,
    .table-panel,
    .preview {
      border-color: rgba(145, 112, 66, 0.28);
      background:
        linear-gradient(180deg, rgba(255, 251, 241, 0.96), rgba(248, 240, 224, 0.92)),
        repeating-linear-gradient(0deg, rgba(116, 84, 45, 0.035), rgba(116, 84, 45, 0.035) 1px, transparent 1px, transparent 8px);
      box-shadow: 0 18px 42px rgba(82, 62, 37, 0.13);
    }

    .hero {
      border-radius: 20px 20px 14px 14px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: 34px;
      bottom: -18px;
      width: 154px;
      height: 42px;
      border: 1px solid rgba(129, 72, 48, 0.24);
      border-radius: 12px 12px 0 0;
      background: rgba(180, 76, 51, 0.10);
      transform: rotate(-1.5deg);
      pointer-events: none;
    }

    .hero h1,
    .table-head h2,
    .preview-title {
      color: #261f18;
    }

    .eyebrow,
    .subtitle,
    .panel-note,
    .note,
    .req-desc,
    .req-next,
    .preview-subtitle,
    .summary-card span {
      color: #6b5a45;
    }

    .hero .metric {
      border-color: rgba(145, 112, 66, 0.28);
      background: rgba(255, 249, 237, 0.86);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.58), 0 10px 22px rgba(82, 62, 37, 0.08);
    }

    .metric strong {
      color: #1f2937;
    }

    .metric .metric-bar {
      background: rgba(145, 112, 66, 0.16);
    }

    .metric .metric-fill {
      background: linear-gradient(90deg, #8b4a36, #315f86);
    }

    .command-bar {
      align-items: end;
      border-radius: 14px;
    }

    .search,
    .select-wrap select {
      border-color: rgba(145, 112, 66, 0.30);
      background: rgba(255, 252, 245, 0.92);
    }

    .segment {
      position: relative;
      border-color: rgba(145, 112, 66, 0.30);
      border-radius: 12px 12px 6px 6px;
      background: #efe2c8;
      color: #4e3f2e;
      box-shadow: inset 0 -2px 0 rgba(116, 84, 45, 0.08);
    }

    .segment.active {
      top: -2px;
      border-color: rgba(139, 74, 54, 0.42);
      background: #fff5df;
      color: #8b3f2d;
      box-shadow: 0 8px 18px rgba(82, 62, 37, 0.12);
    }

    .table-head,
    .preview-head,
    .sidebar-head,
    .summary {
      border-color: rgba(145, 112, 66, 0.20);
      background: rgba(255, 248, 236, 0.72);
    }

    .focus-card,
    .ledger-table .req-item,
    .summary-card {
      border-color: rgba(145, 112, 66, 0.24);
      background: rgba(255, 251, 242, 0.78);
    }

    .focus-card:hover,
    .focus-card.active,
    .ledger-table .req-item:hover,
    .ledger-table .req-item.active {
      border-color: rgba(139, 74, 54, 0.40);
      background: #fff5df;
    }

    .ledger-table .req-item.active {
      box-shadow: inset 4px 0 0 #8b4a36;
    }

    .badge,
    .priority {
      border: 1px solid rgba(255, 255, 255, 0.58);
      box-shadow: 0 3px 8px rgba(82, 62, 37, 0.07);
    }

    .s-intake { background: #e9f0fb; color: #275780; }
    .s-design { background: #fff0cc; color: #825112; }
    .s-dev { background: #e2f0e4; color: #246642; }
    .s-live { background: #ede6da; color: #5f5140; }
    .p1 { background: #f8dfd6; color: #913d2b; }
    .p2 { background: #f8e8bd; color: #7b560f; }
    .p3 { background: #dfeaf4; color: #315f86; }
    .p4 { background: #e9e1d5; color: #5f5140; }

    .preview .markdown {
      background:
        linear-gradient(90deg, rgba(139, 74, 54, 0.10) 0 1px, transparent 1px 100%),
        repeating-linear-gradient(180deg, transparent 0 31px, rgba(145, 112, 66, 0.12) 31px 32px),
        rgba(255, 252, 246, 0.88);
      background-size: 100% 100%, 100% 32px, 100% 100%;
    }

    .markdown h2 {
      border-top-color: rgba(145, 112, 66, 0.22);
    }

    .markdown th,
    .markdown td {
      border-color: rgba(145, 112, 66, 0.24);
    }

    .markdown th {
      background: #f1e4cc;
      color: #514230;
    }

    a.button,
    .ghost-button {
      border-color: rgba(145, 112, 66, 0.30);
