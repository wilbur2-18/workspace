<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .small { font-size: 13px; fill: #697586; }
      .body { font-size: 14px; fill: #263244; }
      .label { font-size: 12px; fill: #5b6675; }
      .title { font-size: 18px; font-weight: 700; fill: #121826; }
      .white { fill: #fff; }
      .muted { fill: #8993a4; }
      .activeText { fill: #155a35; font-weight: 600; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#243044" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="760" height="900" fill="#f6f8fb"/>

  <text x="32" y="42" class="title">左侧边栏 · Vue 同步样例</text>
  <text x="32" y="68" class="small">Paper 画布视觉资产：展开态、收起态、与 Vue 样式映射说明</text>

  <g transform="translate(32 104)" filter="url(#shadow)">
    <rect width="260" height="760" rx="18" fill="#f7f9fc"/>
    <rect x="0" y="0" width="260" height="760" rx="18" fill="#f7f9fc" stroke="#e2e8f0"/>

    <rect x="20" y="18" width="30" height="30" rx="9" fill="#1f6bff"/>
    <text x="61" y="31" class="body" font-weight="700">浙江审计综合分析</text>
    <text x="61" y="49" class="label">Audit Analytics</text>
    <text x="226" y="39" class="muted" font-size="18">‹</text>

    <g transform="translate(18 78)">
      <rect width="224" height="38" rx="10" fill="#ffffff"/>
      <text x="14" y="24" class="body">＋ 新建会话</text>
      <rect y="46" width="224" height="38" rx="10" fill="#ffffff"/>
      <text x="14" y="70" class="body">＋ 新建任务</text>
      <rect y="92" width="224" height="34" rx="10" fill="#eef4ff"/>
      <text x="14" y="114" class="activeText">⌕ 搜索</text>
      <text x="14" y="156" class="body">▦ 技能</text>
    </g>

    <text x="20" y="278" class="small">A市城建集团年度经济责任审计</text>
    <text x="20" y="314" class="label">对话</text>

    <g transform="translate(18 330)">
      <rect width="224" height="38" rx="10" fill="#fff"/>
      <text x="13" y="24" class="body">初始化引导样例</text>
      <text x="181" y="24" class="label">6小时</text>
      <rect y="44" width="224" height="38" rx="10" fill="#fff"/>
      <text x="13" y="68" class="body">请帮我删除结果树里...</text>
      <text x="181" y="68" class="label">7小时</text>
      <rect y="88" width="224" height="38" rx="10" fill="#e7f6ee"/>
      <text x="13" y="112" class="activeText">总结当前工作台中的主...</text>
      <text x="187" y="112" class="label">1周</text>
    </g>

    <text x="20" y="500" class="label">任务</text>
    <g transform="translate(18 516)">
      <rect width="224" height="38" rx="10" fill="#fff"/>
      <text x="13" y="24" class="body">往来函证抽样核对</text>
      <text x="203" y="24" class="label">◌</text>
      <rect y="44" width="224" height="38" rx="10" fill="#fff"/>
      <text x="13" y="68" class="body">企业工商信息批量查询</text>
      <text x="203" y="68" class="label">◌</text>
      <rect y="88" width="224" height="38" rx="10" fill="#fff7f7"/>
      <text x="13" y="112" class="body">采购异常专项扫描</text>
      <text x="205" y="112" fill="#e34848" font-size="14">×</text>
    </g>

    <line x1="20" y1="700" x2="240" y2="700" stroke="#e5ebf2"/>
    <text x="20" y="732" class="body">⚙ 设置</text>
  </g>

  <g transform="translate(328 104)" filter="url(#shadow)">
    <rect width="64" height="760" rx="18" fill="#f7f9fc" stroke="#e2e8f0"/>
    <rect x="17" y="18" width="30" height="30" rx="9" fill="#1f6bff"/>
    <text x="28" y="116" font-size="18" text-anchor="middle" fill="#1f2a3d">＋</text>
    <text x="28" y="162" font-size="18" text-anchor="middle" fill="#1f2a3d">☑</text>
    <rect x="14" y="184" width="36" height="36" rx="10" fill="#eef4ff"/>
    <text x="32" y="207" font-size="17" text-anchor="middle" fill="#1f6bff">⌕</text>
    <text x="32" y="254" font-size="17" text-anchor="middle" fill="#1f2a3d">▦</text>
    <line x1="16" y1="302" x2="48" y2="302" stroke="#e5ebf2"/>
    <circle cx="32" cy="344" r="15" fill="#e7f6ee"/>
    <text x="32" y="349" font-size="13" text-anchor="middle" fill="#20a05a">对</text>
    <circle cx="32" cy="392" r="15" fill="#fff"/>
    <text x="32" y="397" font-size="13" text-anchor="middle" fill="#5b6675">任</text>
    <text x="32" y="732" font-size="17" text-anchor="middle" fill="#5b6675">⚙</text>
  </g>

  <g transform="translate(428 104)">
    <rect width="292" height="318" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="38" class="title">同步映射</text>
    <text x="22" y="72" class="body">Pencil / Paper 画布对象</text>
    <text x="22" y="100" class="small">Sidebar / 展开态</text>
    <text x="22" y="126" class="small">Sidebar / 收起态</text>
    <line x1="22" y1="148" x2="270" y2="148" stroke="#edf1f7"/>
    <text x="22" y="184" class="body">Vue 原型建议映射</text>
    <text x="22" y="212" class="small">.workbench-v2-sidebar</text>
    <text x="22" y="238" class="small">.workbench-v2-shell.is-sidebar-collapsed</text>
    <text x="22" y="264" class="small">--sidebar-width: 260px</text>
    <text x="22" y="290" class="small">--sidebar-collapsed-width: 64px</text>
  </g>

  <g transform="translate(428 450)">
    <rect width="292" height="186" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="22" y="38" class="title">工具结论</text>
    <text x="22" y="76" class="small">Paper：更适合快速视觉表达和评审。</text>
    <text x="22" y="104" class="small">Pencil：更适合作为可解析、可同步的设计源。</text>
    <text x="22" y="132" class="small">同步 Vue 时，优先读 Pencil 变量和节点命名。</text>
    <text x="22" y="160" class="small">Paper 可作为视觉参考，但不作为唯一代码源。</text>
  </g>
</svg>
